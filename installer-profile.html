<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installer Profile — SteadFlow Energies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .profile-head{display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap;}
  .profile-avatar{width:88px; height:88px; border-radius:50%; background:linear-gradient(135deg, var(--canopy-600), var(--dusk-700)); color:var(--white); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:1.8rem; flex:none;}
  .score-badge{display:inline-flex; flex-direction:column; align-items:center; background:var(--canopy-100); color:var(--canopy-700); border-radius:var(--radius-m); padding:.8em 1.2em;}
  .score-badge .num{font-family:var(--font-mono); font-size:1.6rem; font-weight:600;}
  .cert-list li{display:flex; gap:.6em; align-items:flex-start; padding:.5em 0; border-bottom:1px solid var(--sand-300); font-size:.92rem;}
  .cert-list li::before{content:"🎓"; flex:none;}
  .portfolio-card{border:1px solid var(--sand-300); border-radius:var(--radius-m); overflow:hidden;}
  .portfolio-thumb{aspect-ratio:16/9; background:linear-gradient(135deg, var(--canopy-100), var(--sand-200)); display:flex; align-items:center; justify-content:center; color:var(--canopy-700); font-family:var(--font-mono); font-size:.75rem; text-transform:uppercase; letter-spacing:.06em;}
  .portfolio-body{padding:var(--space-2);}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="16" cy="16" r="15" stroke="#1b5e44" stroke-width="1.5"/>
        <path d="M4 20 L10 20 L12 14 L15 24 L18 10 L21 20 L28 20" stroke="#f4b93e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      SteadFlow Energies
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="about.html">About</a>
      <a href="solar-solutions.html">Solar Solutions</a>
      <a href="marketplace.html">Market</a>
      <a href="installers.html" aria-current="page">Installers</a>
      <a href="our-work.html">Our Work</a>
      <a href="resources.html">Resources</a>
      <a href="blog.html">Blog</a>
      <a href="steadflow-iq.html">SteadFlow IQ</a>
      <a href="impact.html">Impact</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-cta">
      <a href="account.html" class="btn btn-outline-dark btn-sm">My Account</a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" id="nav-toggle">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="section-tight" id="profile-root"><!-- rendered by script below --></section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none; margin-top:0;">
      <span>© <span id="year"></span> SteadFlow Energies. All rights reserved.</span>
      <span>Lagos, Nigeria</span>
    </div>
  </div>
</footer>

<script src="installers-data.js"></script>
<script src="script.js"></script>
<script>
  (function () {
    const id = new URLSearchParams(location.search).get('id');
    const inst = getInstallerById(id);
    const root = document.getElementById('profile-root');

    if (!inst) {
      root.innerHTML = `<div class="wrap"><p class="empty-state">Installer not found. <a href="installers.html">Back to directory</a></p></div>`;
      return;
    }

    function initials(name) { return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase(); }
    const v = verificationLabel(inst.verification);

    root.innerHTML = `
      <div class="wrap">
        <a href="installers.html" class="small">← Back to directory</a>
        <div class="profile-head reveal" style="margin-top:var(--space-2);">
          <div class="profile-avatar">${initials(inst.name)}</div>
          <div style="flex:1;">
            <h1 style="font-size:clamp(1.6rem,3vw,2.2rem);">${inst.name}</h1>
            <p class="lede" style="margin:.2em 0;">${inst.title}</p>
            <p class="small">📍 ${inst.location} · ${v.emoji} ${v.text}</p>
          </div>
          <div class="score-badge">
            <span class="num">${inst.score}</span>
            <span class="small">SteadFlow Score</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="grid grid-2 reveal" style="align-items:start;">
          <div>
            <p class="eyebrow">Professional summary</p>
            <p class="lede">${inst.summary}</p>

            <p class="eyebrow" style="margin-top:var(--space-3);">About</p>
            <p>${inst.bio}</p>

            <p class="eyebrow" style="margin-top:var(--space-3);">Professional experience</p>
            <div class="flow-list" style="counter-reset:none;">
              ${inst.workHistory.map(w => `
                <div style="padding-block:var(--space-2); border-top:1px solid var(--sand-300);">
                  <strong>${w.role}</strong> — <span class="small">${w.period}</span>
                  <p class="small" style="margin-top:.3em;">${w.desc}</p>
                </div>`).join('')}
            </div>

            <p class="eyebrow" style="margin-top:var(--space-3);">Areas of expertise</p>
            <div class="inst-tags" style="display:flex; flex-wrap:wrap; gap:.5em;">
              ${inst.specializations.map(s => `<span class="badge-soft">${s}</span>`).join('')}
            </div>

            <p class="eyebrow" style="margin-top:var(--space-3);">Serves</p>
            <p class="small">${inst.serviceAreas.join(' • ')}</p>
          </div>

          <div>
            <div class="card">
              <p class="eyebrow">Qualifications &amp; certifications</p>
              <ul class="cert-list">
                ${inst.certifications.map(c => `<li>${c}</li>`).join('')}
              </ul>
            </div>
            <a href="request-installer.html?id=${inst.id}" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:var(--space-2);">Request This Installer</a>
            <p class="small" style="margin-top:.6em; text-align:center;">SteadFlow will coordinate the next step with you and ${inst.name.split(' ')[0]}.</p>
          </div>
        </div>

        <div class="reveal" style="margin-top:var(--space-5);">
          <p class="eyebrow">Previous projects</p>
          <h2 style="font-size:1.6rem;">Portfolio</h2>
          <div class="grid grid-2" style="margin-top:var(--space-2);">
            ${inst.portfolio.map(p => `
              <div class="portfolio-card">
                <div class="portfolio-thumb">Installation photo</div>
                <div class="portfolio-body">
                  <strong>${p.title}</strong>
                  <p class="small">${p.location}</p>
                  <p class="small">${p.system}</p>
                </div>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
  })();
</script>
</body>
</html>
