<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post — SteadFlow Energies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .post-body{max-width:68ch; margin-inline:auto;}
  .post-body h1{font-size:clamp(1.8rem,3.4vw,2.6rem); margin-top:.4em;}
  .post-body p{font-size:1.05rem; line-height:1.7; color:var(--ink-700);}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="16" cy="16" r="15" stroke="#1b5e44" stroke-width="1.5"/>
        <path d="M4 20 L10 20 L12 14 L15 24 L18 10 L21 20 L28 20" stroke="#f4b93e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      SteadFlow Energies
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="about.html">About</a>
      <a href="solar-solutions.html">Solar Solutions</a>
      <a href="marketplace.html">Market</a>
      <a href="installers.html">Installers</a>
      <a href="our-work.html">Our Work</a>
      <a href="resources.html">Resources</a>
      <a href="blog.html" aria-current="page">Blog</a>
      <a href="steadflow-iq.html">SteadFlow IQ</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-cta">
      <a href="account.html" class="btn btn-outline-dark btn-sm">My Account</a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" id="nav-toggle">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="section-tight">
    <div class="wrap post-body" id="post-root"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none; margin-top:0;">
      <span>© <span id="year"></span> SteadFlow Energies. All rights reserved.</span>
      <span>Lagos, Nigeria</span>
    </div>
  </div>
</footer>

<script src="blog-data.js"></script>
<script src="script.js"></script>
<script>
  (function () {
    const id = new URLSearchParams(location.search).get('id');
    const post = getBlogPostById(id);
    const root = document.getElementById('post-root');

    if (!post) {
      root.innerHTML = `<p class="empty-state">Post not found. <a href="blog.html">Back to Blog</a></p>`;
      return;
    }

    root.innerHTML = `
      <a href="blog.html" class="small">← Back to Blog</a>
      <p class="post-date" style="font-family:var(--font-mono); font-size:.8rem; color:var(--ink-500); margin-top:.8em;">${formatBlogDate(post.date)} · ${post.author}</p>
      <h1>${post.title}</h1>
      <p>${post.body}</p>
    `;
  })();
</script>
</body>
</html>
