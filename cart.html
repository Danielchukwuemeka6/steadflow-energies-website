<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="16" cy="16" r="15" stroke="#1b5e44" stroke-width="1.5"/>
        <path d="M4 20 L10 20 L12 14 L15 24 L18 10 L21 20 L28 20" stroke="#f4b93e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      SteadFlow Energies
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="about.html">About</a>
      <a href="solar-solutions.html">Solar Solutions</a>
      <a href="marketplace.html" aria-current="page">Market</a>
      <a href="installers.html">Installers</a>
      <a href="our-work.html">Our Work</a>
      <a href="resources.html">Resources</a>
      <a href="blog.html">Blog</a>
      <a href="steadflow-iq.html">SteadFlow IQ</a>
      <a href="impact.html">Impact</a>
      <a href="partner.html">Partner</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-cta">
      <a href="account.html" class="btn btn-outline-dark btn-sm">My Account</a>
      <a href="cart.html" class="cart-link" aria-label="View cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-badge cart-count" hidden>0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" id="nav-toggle">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <h1 style="font-size:2rem; margin-bottom:var(--space-3);">Your Cart</h1>
      <div id="cart-root"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none; margin-top:0; padding-top:0;">
      <span>© <span id="year"></span> SteadFlow Energies. All rights reserved.</span>
      <span>Lagos, Nigeria</span>
    </div>
  </div>
</footer>

<script src="products-data.js"></script>
<script src="cart.js"></script>
<script src="script.js"></script>
<script>
  (function () {
    const root = document.getElementById('cart-root');

    function render() {
      const items = cartLineItems();

      if (items.length === 0) {
        root.innerHTML = `
          <div class="empty-state">
            <h2>Your cart is empty</h2>
            <p>Browse the marketplace to add panels, batteries, and accessories.</p>
            <a href="marketplace.html" class="btn btn-primary" style="margin-top:var(--space-2);">Go to Market</a>
          </div>`;
        return;
      }

      const rows = items.map(item => `
        <tr>
          <td>
            <div class="cart-item-info">
              ${productImgTag(item.product.images[0], item.product.name)}
              <div>
                <div class="product-name">${item.product.name}</div>
                <div class="product-vendor">${item.product.vendor}</div>
              </div>
            </div>
          </td>
          <td class="product-price">${priceHTML(item.product)}</td>
          <td>
            <div class="qty-stepper">
              <button type="button" data-minus="${item.product.id}" aria-label="Decrease quantity">–</button>
              <input type="number" value="${item.qty}" min="1" max="${item.product.stock}" data-qty="${item.product.id}">
              <button type="button" data-plus="${item.product.id}" aria-label="Increase quantity">+</button>
            </div>
          </td>
          <td class="product-price">${formatNaira(item.lineTotal)}</td>
          <td><button class="cart-remove" data-remove="${item.product.id}">Remove</button></td>
        </tr>
      `).join('');

      const subtotal = cartTotal();
      const delivery = subtotal > 0 ? 5000 : 0;

      root.innerHTML = `
        <div class="grid grid-2" style="align-items:start;">
          <div style="overflow-x:auto;">
            <table class="cart-table">
              <thead>
                <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th><th></th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="cart-summary">
            <h3 style="font-size:1.1rem;">Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><span>${formatNaira(subtotal)}</span></div>
            <div class="summary-row"><span>Delivery (estimate)</span><span>${formatNaira(delivery)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatNaira(subtotal + delivery)}</span></div>
            <a href="checkout.html" class="btn btn-primary" style="justify-content:center; margin-top:var(--space-2);">Proceed to Checkout</a>
            <a href="marketplace.html" class="small" style="text-align:center; margin-top:.4em;">Continue shopping</a>
          </div>
        </div>
      `;

      root.querySelectorAll('[data-minus]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.minus;
        const current = getCart()[id] || 1;
        setQty(id, current - 1);
        render();
      }));
      root.querySelectorAll('[data-plus]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.plus;
        const current = getCart()[id] || 0;
        setQty(id, current + 1);
        render();
      }));
      root.querySelectorAll('[data-qty]').forEach(input => input.addEventListener('change', () => {
        setQty(input.dataset.qty, Math.max(1, parseInt(input.value, 10) || 1));
        render();
      }));
      root.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => {
        removeFromCart(btn.dataset.remove);
        render();
      }));
    }

    render();
  })();
</script>
</body>
</html>
